name: Git cache

on:
  push:
    paths:
      - .github/workflows/git-cache.yml
  schedule:
    # Once a day, off the hour because GitHub delays or drops scheduled runs at the top of the hour.
    - cron: "17 3 * * *"

concurrency:
  group: git-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  save:
    if: github.repository_owner == 'Homebrew'
    # `ci.yml` restores this on macOS. The cache version includes the compression method, so save on macOS too.
    runs-on: macos-latest
    permissions:
      actions: write # to delete superseded caches
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Save Git cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: git-snapshot-${{ github.run_id }}

      - name: Delete superseded Git caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          key="git-snapshot-${GITHUB_RUN_ID}"
          caches="$(gh cache list --ref "${GITHUB_REF}" --key git-snapshot- --limit 100 --json id,key)"
          if ! jq -e --arg key "${key}" 'any(.[]; .key == $key)' <<<"${caches}" >/dev/null
          then
            echo "::warning::${key} is not listed, so keeping the older Git caches."
            exit 0
          fi

          jq -r --arg key "${key}" '.[] | select(.key != $key) | .id' <<<"${caches}" |
            while read -r id
            do
              gh cache delete "${id}"
            done
